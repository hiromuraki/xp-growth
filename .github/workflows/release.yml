# 打 tag（v + gradle.properties 中的 version）推送到 origin 时构建并发版，
# 版本号与 tag 不一致时任务直接失败。

name: release
on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-24.04
        steps:
            - name: checkout repository
              uses: actions/checkout@v7

            - name: validate gradle wrapper
              uses: gradle/actions/wrapper-validation@v6

            - name: setup jdk
              uses: actions/setup-java@v6
              with:
                  java-version: "25"
                  distribution: "temurin"

            - name: resolve version
              run: |
                  version=$(grep -E '^version=' gradle.properties | cut -d= -f2)
                  if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
                      echo "tag ${GITHUB_REF_NAME} 与 gradle.properties 的 version ${version} 不一致" >&2
                      exit 1
                  fi
                  echo "VERSION=${version}" >> "${GITHUB_ENV}"

            - name: make gradle wrapper executable
              run: chmod +x ./gradlew

            - name: build
              run: ./gradlew build

            - name: publish release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" "build/libs/xp-growth-${VERSION}.jar" \
                      --title "${GITHUB_REF_NAME}" \
                      --generate-notes
